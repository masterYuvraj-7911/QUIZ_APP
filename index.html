<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<meta name="description" content="Test your JavaScript knowledge with fun and interactive quizzes. Challenge yourself with JavaScript questions and improve your programming skills.">
		<title>TESTJS_APP</title>
		<link rel="stylesheet" href="index.css" />
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
	</head>
	<body>
		<main>
			<img src="./images/banner.webp" alt="" />
			<div class="btn-container">
				<button id="start-btn">START NOW</button>
			</div>
		</main>
		<script>
			let played = 0;
			const startBtn = document.querySelector("#start-btn");
			
			const info = JSON.parse(localStorage.getItem("game-info"));

			if(info) played = info.played;
			else localStorage.setItem("game-info",JSON.stringify({ total : 20, played : 0, win : 0})); 
			
			startBtn.addEventListener("click", () => window.location.href = "./game.html?question-no="+ ++played);
		</script>
	</body>
</html>
