<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>QUIZ_APP</title>
		<style>
			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}
			html,
			body {
				width: 100%;
				user-select: none;
				font-family: sans-serif;
			}
			body {
				position: fixed;
				height: 100vh;
				width: 100vw;
				background: #97fe68;
			}
			main {
				height: 100vh;
				max-width: 600px;
				margin: auto;
			}
			main header {
				height: 20vh;
				display: flex;
				align-items: center;
				justify-content: center;
				flex-direction: column;
			}
			main header img {
				height: 50%;
			}
			main .pie-chart-container {
				height: 50vh;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			main .pie-chart-container .outer {
				height: 40vh;
				aspect-ratio: 1;
				max-height: 90vw;
				border-radius: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			main .pie-chart-container .inner {
				height: 75%;
				aspect-ratio: 1;
				background: white;
				border-radius: 100%;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 20px;
				font-weight: bold;
			}
			main .info {
				display: flex;
				align-items: center;
				justify-content: center;
				height: 20vh;
			}
			main .info button {
                all: unset;
                text-align: center;
				background: #35bd3a;
				color: white;
				width: 300px;
				aspect-ratio: 4/1;
				max-width: 40vw;
				font-weight: 700;
				border: none;
				border-radius: 8px;
				font-size: clamp(12px, 5vw, 28px);
			}
		</style>
	</head>
	<body>
		<main>
			<header>
				<img src="./images/banner.png" alt="" />
				<h2>Result</h2>
			</header>
			<div class="pie-chart-container">
				<div class="outer">
					<div class="inner"></div>
				</div>
			</div>
			<div class="info">
				<button class="retry-btn">Retry</button>
			</div>
			<footer></footer>
		</main>
		<script>
			const gameInfo = JSON.parse(localStorage.getItem("game-info"));
			if (!gameInfo) location.href = "/index.html";
			const win = gameInfo.win;
			const total = gameInfo.total;
			const winRate = (win / total) * 100;

			document.querySelector(".pie-chart-container .outer").style.background = `conic-gradient(red 0% ${100 - winRate}%,#35BD3A 0% ${winRate}%)`;
			document.querySelector(".pie-chart-container .inner").textContent = `SCORE: ${win}/${total}`;
			document.querySelector(".retry-btn").addEventListener("click", () => {
                localStorage.clear();
                location.href = "/index.html"
            });
		</script>
	</body>
</html>
